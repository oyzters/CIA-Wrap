<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  /* Mismo lenguaje que iVirtual Wrap: Figtree, azules ITSON y esquinas suaves. */
  :root{
    --blue-700:#5b9dff; --blue-600:#8bbaff; --blue-50:rgba(91,157,255,.14); --fill:#0b5cad;
    --ink:#f4f6f9; --ink-2:#c7cdd8; --muted:#93a0b0; --line:rgba(255,255,255,.1); --bg:#14171d;
    --off:#3a414d;
  }
  :root[data-theme="light"]{
    --blue-700:#0b5cad; --blue-600:#1461bd; --blue-50:#eef5fc;
    --ink:#0f1b2d; --ink-2:#38465c; --muted:#6b7891; --line:#e5eaf2; --bg:#fff;
    --off:#c7ced6;
  }
  *{box-sizing:border-box}
  body{ width:268px; margin:0; padding:16px;
    font:14px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }

  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .brand img{ width:34px; height:34px; border-radius:9px; object-fit:cover; }
  h1{ font-size:15px; font-weight:800; letter-spacing:-.01em; margin:0; }
  p.sub{ margin:1px 0 0; font-size:12px; color:var(--muted); }

  .card{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--blue-50); }
  .card + .card{ margin-top:8px; }
  .card .label{ font-size:13.5px; font-weight:600; color:var(--ink-2); }

  .sw{ position:relative; width:46px; height:26px; flex:none; cursor:pointer;
    background:var(--off); border-radius:999px; transition:.2s; }
  .sw::before{ content:""; position:absolute; height:20px; width:20px; left:3px; top:3px;
    background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(15,27,45,.25); transition:.2s; }
  .sw[aria-checked="true"]{ background:var(--fill); }
  .sw[aria-checked="true"]::before{ transform:translateX(20px); }
  .sw:focus-visible{ outline:0; box-shadow:0 0 0 3px rgba(26,115,199,.35); }

  .seg{ display:flex; gap:2px; padding:2px; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
  .seg button{ border:none; background:none; cursor:pointer; color:var(--muted); font:inherit; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; display:flex; align-items:center; gap:5px; transition:background .15s, color .15s; }
  .seg button svg{ width:13px; height:13px; }
  .seg button:hover{ color:var(--blue-700); }
  .seg button.on{ background:var(--fill); color:#fff; }

  .state{ display:flex; align-items:center; gap:7px; margin-top:12px; font-size:12px; color:var(--muted); }
  .dot{ width:8px; height:8px; border-radius:999px; background:var(--off); }
  body.on .dot{ background:var(--blue-600); }
  .state b{ color:var(--blue-700); font-weight:700; }

  footer{ margin-top:14px; padding-top:11px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  footer a{ color:var(--blue-700); font-weight:600; text-decoration:none; }
  footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="brand">
    <img src="logo.png" alt="">
    <div>
      <h1>ITSON CIA Wrap</h1>
      <p class="sub">Interfaz moderna para el portal CIA</p>
    </div>
  </div>

  <div class="card">
    <span class="label">Activar wrap</span>
    <div id="sw" class="sw" role="switch" aria-checked="true" aria-label="Activar wrap" tabindex="0"></div>
  </div>

  <div class="card">
    <span class="label">Tema</span>
    <div class="seg">
      <button data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>Claro</button>
      <button data-theme="dark" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Oscuro</button>
    </div>
  </div>

  <div class="state"><span class="dot"></span>Estado: <b id="st">Activada</b></div>

  <footer>Corre sobre tu sesión, sin servidor · <a href="https://github.com/oyzters/CIA-Wrap" target="_blank" rel="noopener">Código</a></footer>

  <script src="popup.js"></script>
</body>
</html>
